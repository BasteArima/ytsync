<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ytsync</title>
<link rel="stylesheet" href="/static/fonts.css">
<style>
:root{
  color-scheme:light;
  --paper:#f4f6f8;--surface:#fff;--sunk:#eaeef2;--ink:#14181d;--ink2:#3d454f;
  --mut:#6d7681;--line:#dde2e8;--line2:#c6ced6;
  --ok:#1f7a5a;--warn:#96670f;--bad:#b03a30;--run:#2f6fd0;
  --okbg:#e6f2ec;--warnbg:#f7efdd;--badbg:#f9e9e7;--runbg:#e9f1fc;
  --lift:0 1px 2px rgba(18,24,32,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --paper:#0b0e12;--surface:#181d24;--sunk:#212831;--ink:#e9edf1;--ink2:#c4ccd5;
  --mut:#8d97a3;--line:#2b323b;--line2:#3b444f;
  --ok:#4fbf92;--warn:#e0ab45;--bad:#ef7f74;--run:#74a9f2;
  --okbg:#13291f;--warnbg:#2d2312;--badbg:#301a17;--runbg:#16243a;
  --lift:0 1px 2px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0b0e12;--surface:#181d24;--sunk:#212831;--ink:#e9edf1;--ink2:#c4ccd5;
  --mut:#8d97a3;--line:#2b323b;--line2:#3b444f;
  --ok:#4fbf92;--warn:#e0ab45;--bad:#ef7f74;--run:#74a9f2;
  --okbg:#13291f;--warnbg:#2d2312;--badbg:#301a17;--runbg:#16243a;
  --lift:0 1px 2px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
     font:16px/1.5 "IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
     -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
     zoom:var(--ui-zoom,1)}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
.grow{flex:1}
.appbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.brand{font-weight:700;font-size:18px;letter-spacing:-.01em}
.statusline{font-size:13px;color:var(--mut);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.statusline b{color:var(--ink);font-weight:600}
.sep{color:var(--line2)}
button{font:inherit;font-size:13.5px;padding:7px 13px;border-radius:8px;cursor:pointer;
       border:1px solid var(--line2);background:var(--surface);color:var(--ink)}
button:hover:not(:disabled){border-color:var(--run)}
button:focus-visible{outline:2px solid var(--run);outline-offset:2px}
button:disabled{opacity:.42;cursor:not-allowed}
button.primary{background:var(--run);border-color:var(--run);color:#fff}
button.danger{color:var(--bad)}
button.sm{font-size:12.5px;padding:5px 10px}
input,select,textarea{font:inherit;font-size:13.5px;padding:6px 10px;border-radius:8px;
  border:1px solid var(--line2);background:var(--paper);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--run);outline-offset:1px}
input[type=text],input[type=password]{min-width:170px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:3px 10px;
      border-radius:99px;background:var(--sunk);color:var(--mut);white-space:nowrap}
.chip.run{background:var(--runbg);color:var(--run)}
.chip.bad{background:var(--badbg);color:var(--bad)}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.chip.ok{background:var(--okbg);color:var(--ok)}
.pulse{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none;
       animation:pl 1.6s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.banner{border:1px solid var(--warn);background:var(--warnbg);color:var(--warn);
        border-radius:10px;padding:9px 13px;margin-bottom:10px;font-size:13.5px}
.runbar{border:1px solid var(--run);background:var(--runbg);border-radius:11px;
        padding:12px 14px;display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
.runtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.runfile{font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog{height:5px;border-radius:99px;background:var(--surface);overflow:hidden}
.prog i{display:block;height:100%;background:var(--run);transition:width .3s}
.queue{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--mut)}
/* overflow-x:auto по спецификации делает overflow-y вычисляемым как auto,
   отчего сбоку вылезала вертикальная полоса прокрутки. Гасим её явно. */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:14px 0;
      overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;color:var(--mut);border-bottom:2px solid transparent;
  border-radius:0;margin-bottom:-1px;padding:8px 14px;font-size:14px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--run);font-weight:600}
.row{display:grid;grid-template-columns:4px 1fr;border:1px solid var(--line);
     border-radius:10px;overflow:hidden;margin-bottom:8px;background:var(--surface);
     box-shadow:var(--lift);transition:border-color .15s}
.row:hover{border-color:var(--line2)}
.rail{background:var(--line2)}
.rail.ok{background:var(--ok)}.rail.warn{background:var(--warn)}
.rail.bad{background:var(--bad)}.rail.run{background:var(--run)}
/* Три колонки: кто — сколько — что делать. Цифры встают на одно место во всех
   строках, поэтому читаются столбцом, а ширина карточки не пустует. */
.rmain{padding:13px 16px 14px;min-width:0;display:grid;gap:8px 22px;align-items:center;
       grid-template-columns:minmax(200px,1fr) minmax(0,1.7fr) auto}
.rid{min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.rid b{font-size:17px;letter-spacing:-.01em}
.rpath{font-size:13px;color:var(--mut)}
.racts{display:flex;gap:7px;justify-self:end}
.rnums{display:flex;gap:20px;font-size:14px;flex-wrap:wrap;color:var(--mut)}
.rnums b{color:var(--ink);font-weight:600}
.rnums .g{color:var(--ok)}.rnums .y{color:var(--warn)}.rnums .r{color:var(--bad)}
.rmeta{grid-column:1/-1;font-size:12.5px;color:var(--mut);margin-top:-2px}
@media (max-width:900px){
  .rmain{grid-template-columns:1fr}
  .racts{justify-self:start}
}
.card{background:var(--surface);border:1px solid var(--line);border-radius:11px;
      padding:14px 16px;margin-bottom:10px}
.card h3{margin:0 0 3px;font-size:15px}
.hint{font-size:13px;color:var(--mut);margin:6px 0}
.card .hint{margin:0 0 11px}
.field{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field+.field{margin-top:9px}
label.inl{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:6px}
details{margin-top:8px}
summary{cursor:pointer;color:var(--run);font-size:13.5px}
.scroll{max-height:290px;overflow:auto;margin-top:6px;border:1px solid var(--line);
        border-radius:8px}
table{border-collapse:collapse;width:100%}
td,th{padding:5px 9px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;
      vertical-align:top}
th{color:var(--mut);font-weight:500;position:sticky;top:0;background:var(--surface)}
pre.log{background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:11px;
        font-size:12px;margin:0;max-height:460px;overflow:auto;white-space:pre-wrap;
        word-break:break-word;font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;
        color:var(--ink2)}
/* Закрытые списки стоят в одну строку рядом, раскрытый занимает всю ширину */
.rdet{grid-column:1/-1;display:flex;gap:8px 18px;flex-wrap:wrap;align-items:baseline;
      margin-top:2px;border-top:1px solid var(--line);padding-top:9px}
.rdet details{margin:0;flex:0 0 auto}
.rdet details[open]{flex:1 1 100%;padding-bottom:2px}
.rdet summary{font-size:13px}
.rec-item{border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:8px;
          background:var(--surface)}
.rec-file{font-size:13px;word-break:break-word;margin-bottom:6px}
.rec-opt{display:flex;gap:7px;align-items:flex-start;font-size:13px;padding:3px 0}
.rec-opt input{min-width:0}
.score{color:var(--mut);font-size:12px}
[hidden]{display:none!important}
.empty{color:var(--mut);font-size:14px;padding:14px 0}
</style>
</head>
<body>
<div class="wrap">

  <div class="appbar">
    <span class="brand">ytsync</span>
    <div class="statusline mono" id="status"></div>
    <span class="grow"></span>
    <button id="bIndex" data-i18n="reindex_all"></button>
    <button class="primary" id="bSync" data-i18n="sync_all"></button>
    <button id="bOut" data-i18n="logout" data-i18n-title="logout_title"></button>
  </div>

  <div id="warn"></div>
  <div id="runbar"></div>

  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-t="pl" data-i18n="tab_playlists"></button>
    <button role="tab" aria-selected="false" data-t="set" data-i18n="tab_settings"></button>
    <button role="tab" aria-selected="false" data-t="ck" data-i18n="tab_cookies"></button>
    <button role="tab" aria-selected="false" data-t="rec" data-i18n="tab_reconcile"></button>
    <button role="tab" aria-selected="false" data-t="log" data-i18n="tab_log"></button>
  </div>

  <section data-p="pl">
    <div id="cards"></div>
    <div class="card">
      <h3 data-i18n="add_title"></h3>
      <p class="hint" data-i18n="add_hint"></p>
      <form class="field" id="fAdd">
        <input type="text" id="aUrl" data-i18n-ph="add_url" required>
        <input type="text" id="aFolder" list="folders" data-i18n-ph="add_folder" required
               style="min-width:140px">
        <datalist id="folders"></datalist>
        <input type="text" id="aName" data-i18n-ph="add_name" style="min-width:130px">
        <button class="primary" type="submit" data-i18n="add_btn"></button>
      </form>
    </div>
  </section>

  <section data-p="set" hidden>
    <div class="card">
      <h3 data-i18n="dl_title"></h3>
      <p class="hint" data-i18n="dl_hint"></p>
      <form id="fCfg">
        <div class="field">
          <label class="inl"><span data-i18n="cfg_hours"></span>
            <input type="text" id="cHours" style="width:80px"></label>
          <label class="inl"><span data-i18n="cfg_quiet"></span>
            <input type="text" id="cQuiet" style="width:110px" data-i18n-ph="cfg_quiet_ph"></label>
          <label class="inl"><span data-i18n="cfg_free"></span>
            <input type="number" id="cFree" min="0" step="1" style="width:74px"> GB</label>
        </div>
        <div class="field">
          <label class="inl"><span data-i18n="cfg_rate"></span>
            <input type="text" id="cRate" data-i18n-ph="cfg_rate_ph" style="min-width:100px"></label>
          <label class="inl"><span data-i18n="cfg_format"></span>
            <input type="text" id="cFmt" data-i18n-ph="cfg_format_ph" style="min-width:170px"></label>
        </div>
        <div class="field">
          <label class="inl"><span data-i18n="cfg_tpl"></span>
            <input type="text" id="cTpl" style="min-width:320px"></label>
          <label class="inl"><input type="checkbox" id="cThumb">
            <span data-i18n="cfg_thumbs"></span></label>
          <button class="primary" type="submit" data-i18n="save"></button>
        </div>
      </form>
    </div>

    <div class="card">
      <h3 data-i18n="view_title"></h3>
      <p class="hint" data-i18n="view_hint"></p>
      <div class="field">
        <label class="inl"><span data-i18n="view_lang"></span>
          <select id="cLang">
            <option value="ru">Русский</option>
            <option value="en">English</option>
          </select></label>
        <label class="inl"><span data-i18n="view_theme"></span>
          <select id="cTheme">
            <option value="auto" data-i18n="theme_auto"></option>
            <option value="light" data-i18n="theme_light"></option>
            <option value="dark" data-i18n="theme_dark"></option>
          </select></label>
        <label class="inl"><span data-i18n="view_zoom"></span>
          <select id="cZoom">
            <option value="0.9">90%</option>
            <option value="1">100%</option>
            <option value="1.1">110%</option>
            <option value="1.25">125%</option>
            <option value="1.4">140%</option>
            <option value="1.6">160%</option>
          </select></label>
      </div>
    </div>

    <div class="card">
      <h3 data-i18n="acc_title"></h3>
      <p class="hint" data-i18n="acc_hint"></p>
      <form class="field" id="fPw">
        <input type="password" id="pwOld" data-i18n-ph="acc_current"
               autocomplete="current-password" required>
        <input type="password" id="pwNew" data-i18n-ph="acc_new"
               autocomplete="new-password" minlength="6" required>
        <button type="submit" data-i18n="acc_change"></button>
        <button type="button" class="danger" id="bRevoke" data-i18n="acc_revoke"></button>
      </form>
    </div>
  </section>

  <section data-p="ck" hidden>
    <div class="card">
      <div class="field"><h3 style="margin:0" data-i18n="ck_title"></h3><span class="grow"></span>
        <span id="cookState" class="chip"></span></div>
      <p class="hint" style="margin-top:9px" data-i18n="ck_hint"></p>
      <form class="field" id="fCook">
        <input type="file" id="kFile" accept=".txt,text/plain">
        <button class="primary" type="submit" data-i18n="ck_upload"></button>
        <button type="button" class="danger" id="kDel" data-i18n="delete"></button>
      </form>
      <details>
        <summary data-i18n="ck_paste"></summary>
        <p class="hint" style="margin:6px 0" data-i18n="ck_paste_hint"></p>
        <textarea id="kText" rows="5"
                  style="width:100%;font-family:'IBM Plex Mono',ui-monospace,monospace"></textarea>
        <button id="kPaste" style="margin-top:6px" data-i18n="ck_paste_save"></button>
      </details>
    </div>
  </section>

  <section data-p="rec" hidden>
    <div class="card">
      <h3 data-i18n="rec_title"></h3>
      <p class="hint" data-i18n="rec_hint"></p>
      <div class="field">
        <select id="recFolder"></select>
        <button id="recLoad" data-i18n="rec_load"></button>
        <span class="grow"></span>
        <button class="primary" id="recApply" disabled data-i18n="rec_apply"></button>
      </div>
      <div id="recBody" class="empty" data-i18n="rec_empty"></div>
    </div>
  </section>

  <section data-p="log" hidden>
    <div class="card">
      <div class="field"><h3 style="margin:0" data-i18n="log_title"></h3><span class="grow"></span>
        <label class="inl"><input type="checkbox" id="lAuto" checked>
          <span data-i18n="log_auto"></span></label>
        <button id="bLog" data-i18n="refresh"></button></div>
      <pre class="log" id="log" style="margin-top:10px"></pre>
    </div>
  </section>
</div>

<script>
/* =================== локализация =================== */
const I18N = {

  reindex_all:"Переиндексировать всё", sync_all:"Синхронизировать всё",

  tab_playlists:"Плейлисты", tab_settings:"Настройки", tab_cookies:"Куки",
  tab_reconcile:"Сверка", tab_log:"Журнал",
  add_title:"Добавить плейлист",
  add_hint:"Папка создастся сразу вместе с пустым archive.txt. Укажешь существующую — её архив подхватится, и уже скачанное не пойдёт заново.",
  add_url:"ссылка на плейлист", add_folder:"папка", add_name:"название", add_btn:"Добавить",

  view_lang:"Язык", view_theme:"Тема", view_zoom:"Масштаб интерфейса",

  rec_skip:"пропустить", rec_notin:"нет в плейлисте", rec_nothing:"Ничего не выбрано.",

  b_pause:"Пауза", b_stop:"Остановить", b_stop_title:"Недокачанный файл сохранится и продолжится позже",
  q_next:"Дальше:", q_inq:"В очереди:", q_clear:"Очистить очередь",
  badge_running:"идёт синк", badge_queued:"в очереди", badge_noindex:"не индексирован",

  th_id:"ID", th_title:"Название", th_reason:"Причина", reason_gone:"нет в плейлисте",
  file_of:"файл {a} из {b}",

let lang = "ru";
try { lang = localStorage.getItem("ytsync-lang")
      || ((navigator.language || "").toLowerCase().startsWith("ru") ? "ru" : "en"); } catch(e) {}

function t(key, vars) {
  let s = (I18N[lang] && I18N[lang][key]) ?? I18N.ru[key] ?? key;
  if (vars) for (const k in vars) s = s.split("{" + k + "}").join(vars[k]);
  return s;
}
// Сервер присылает ключи стадий и сообщений, а не готовый текст, чтобы
// английский интерфейс не показывал русские слова. Незнакомое отдаём как есть.
function tkey(v, pfx = "") {
  if (!v) return "";
  const k = pfx + v;
  return (I18N[lang] && I18N[lang][k]) || I18N.ru[k] || v;
}
function applyStatic() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll("[data-i18n-title]").forEach(el => el.title = t(el.dataset.i18nTitle));
}
const loc = () => lang === "ru" ? "ru-RU" : "en-GB";

/* =================== вспомогательное =================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dt = s => s ? new Date(s).toLocaleString(loc()) : "—";
function ago(s) {
  if (!s) return t("ago_never");
  const m = Math.round((Date.now() - new Date(s)) / 60000);
  if (m < 1) return t("ago_now");
  if (m < 60) return t("ago_min", {n:m});
  const h = Math.round(m / 60);
  if (h < 24) return t("ago_h", {n:h});
  const d = Math.round(h / 24);
  return d < 30 ? t("ago_d", {n:d}) : new Date(s).toLocaleDateString(loc());
}
let STATE = null, busy = false;
// Раскрыт всегда не более одного списка. Ключ хранится отдельно от разметки,
// поэтому переживает перерисовку карточек при опросе состояния.
let openDet = null;
const orphCache = {};
let cardsSig = "";

async function api(url, opt) {
  const r = await fetch(url, opt);
  if (r.status === 401) { location.href = "/login"; throw new Error(t("e_auth")); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || d.message || t("e_generic"));
  return d;
}

/* =================== вид: язык, тема, масштаб =================== */
function applyTheme(v) {
  if (v === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", v);
  try { localStorage.setItem("ytsync-theme", v); } catch(e) {}
}
function applyZoom(v) {
  document.documentElement.style.setProperty("--ui-zoom", v);
  try { localStorage.setItem("ytsync-zoom", v); } catch(e) {}
}
let theme = "auto", zoom = "1";
try { theme = localStorage.getItem("ytsync-theme") || "auto";
      zoom = localStorage.getItem("ytsync-zoom") || "1"; } catch(e) {}
applyTheme(theme); applyZoom(zoom); applyStatic();
$("#cTheme").value = theme; $("#cZoom").value = zoom; $("#cLang").value = lang;
$("#cTheme").onchange = e => applyTheme(e.target.value);
$("#cZoom").onchange = e => applyZoom(e.target.value);
$("#cLang").onchange = e => {
  lang = e.target.value;
  try { localStorage.setItem("ytsync-lang", lang); } catch(err) {}
  applyStatic();
  cardsSig = "";                       // подписи в карточках тоже переводятся
  refresh().catch(() => {});
  loadLog();
};

const tabs = document.querySelectorAll(".tabs button");
tabs.forEach(tb => tb.onclick = () => {
  tabs.forEach(x => x.setAttribute("aria-selected", String(x === tb)));
  document.querySelectorAll("[data-p]").forEach(p => p.hidden = p.dataset.p !== tb.dataset.t);
  if (tb.dataset.t === "log") loadLog();
  try { localStorage.setItem("ytsync-tab", tb.dataset.t); } catch(e) {}
});
try {
  const saved = localStorage.getItem("ytsync-tab");
  if (saved) { const b = document.querySelector(`.tabs button[data-t="${saved}"]`); if (b) b.click(); }
} catch(e) {}

/* =================== строка плейлиста =================== */
function rail(p) {
  if (p.running) return "run";
  if (p.lost) return "bad";
  if (p.pending) return "warn";
  return "ok";
}
function sizeChip(p) {
  if (!p.pending) return "";
  return p.pending_gb != null
    ? `<span class="chip">≈ ${p.pending_gb} GB</span>`
    : `<span class="chip">${t("size_unknown")}</span>`;
}
function tbl(items, withReason) {
  if (!items || !items.length) return `<div class="hint">${t("empty")}</div>`;
  return `<div class="scroll"><table><tr><th>${t("th_id")}</th><th>${t("th_title")}</th>${
    withReason ? `<th>${t("th_reason")}</th>` : ""}</tr>` + items.map(i => `<tr>
      <td class="mono"><a href="https://youtu.be/${esc(i.video_id)}" target="_blank"
        rel="noopener">${esc(i.video_id)}</a></td>
      <td>${esc(i.title)}</td>
      ${withReason ? `<td>${esc(i.problem || t("reason_gone"))}</td>` : ""}</tr>`).join("")
    + "</table></div>";
}
function row(p) {
  const acts = p.running
    ? `<button disabled>${t("run_sync")}</button>`
    : p.queued
      ? `<button data-act="unqueue" data-f="${esc(p.folder)}">${t("run_unqueue")}</button>`
      : `<button data-act="index" data-f="${esc(p.folder)}">${t("run_index")}</button>
         <button class="primary" data-act="sync" data-f="${esc(p.folder)}">${t("run_sync")}</button>`;
  const badge = p.running
    ? `<span class="chip run"><i class="pulse"></i>${t("badge_running")}</span>`
    : p.queued ? `<span class="chip warn">${t("badge_queued")}</span>` : "";
  // Нулевые счётчики не показываем: они только шумят. Всего и скачано — всегда.
  const nums = [
    `${t("n_total")} <b>${p.in_playlist}</b>`,
    `${t("n_done")} <b class="g">${p.downloaded}</b>`,
    p.pending ? `${t("n_pending")} <b class="y">${p.pending}</b>` : "",
    p.rescued ? `${t("n_rescued")} <b class="g">${p.rescued}</b>` : "",
    p.lost ? `${t("n_lost")} <b class="r">${p.lost}</b>` : "",
    p.files_without_id ? `${t("n_noid")} <b class="y">${p.files_without_id}</b>` : "",
  ].filter(Boolean).map(x => `<span>${x}</span>`).join("");

  // Ключ нужен, чтобы раскрытый список пережил перерисовку по опросу состояния
  const dd = (key, title, body, extra = "") => {
    const k = `${p.folder}|${key}`;
    return `<details data-det="${esc(k)}"${openDet === k ? " open" : ""}${extra}>
      <summary>${title}</summary>${openDet === k ? body : ""}</details>`;
  };
  const det = [
    p.pending ? dd("pending", t("d_pending", {n:p.pending}),
      `<div class="hint">${t("d_pending_hint")}</div>${tbl(p.pending_items, false)}`) : "",
    p.rescued ? dd("rescued", t("d_rescued", {n:p.rescued}),
      `<div class="hint">${t("d_rescued_hint")}</div>${tbl(p.rescued_items, true)}`) : "",
    p.lost ? dd("lost", t("d_lost", {n:p.lost}),
      `<div class="hint">${t("d_lost_hint")}</div>${tbl(p.lost_items, true)}
       <button class="sm" style="margin-top:7px" data-act="retry" data-f="${esc(p.folder)}">
         ${t("d_retry", {n:p.lost})}</button>`) : "",
    p.files_without_id ? dd("orph", t("d_orph", {n:p.files_without_id}),
      `<div class="hint">${t("d_orph_hint")}</div>
       ${orphCache[p.folder]
         ? `<div class="scroll"><table>${orphCache[p.folder]
             .map(f => `<tr><td class="mono">${esc(f)}</td></tr>`).join("")}</table></div>`
         : `<div class="hint">${t("loading")}</div>`}`,
      ` data-orph="${esc(p.folder)}"`) : "",
  ].join("");

  return `<div class="row">
    <div class="rail ${rail(p)}"></div>
    <div class="rmain">
      <div class="rid"><b>${esc(p.name)}</b><span class="rpath mono">/${esc(p.folder)}</span>
        ${badge}${sizeChip(p)}
        ${p.indexed ? "" : `<span class="chip">${t("badge_noindex")}</span>`}</div>
      <div class="rnums mono">${nums}</div>
      <div class="racts">${acts}
        <button class="danger" data-act="del" data-f="${esc(p.folder)}">${t("run_del")}</button></div>
      <div class="rmeta">${t("meta_checked", {t: ago(p.indexed_at)})}${
        p.last_run && p.last_run.added ? ` · ${t("meta_added", {n:p.last_run.added})}` : ""}${
        p.last_run && p.last_run.message
          ? ` · <span style="color:var(--bad)">${esc(tkey(p.last_run.message))}</span>` : ""}</div>
      ${det ? `<div class="rdet">${det}</div>` : ""}
    </div>
  </div>`;
}

/* =================== обновление =================== */
async function refresh() {
  const s = await api("/api/state");
  STATE = s;
  const d = s.disk, r = s.runner, cur = r.current;
  busy = !!cur;

  $("#status").innerHTML =
    `<span>${t("st_schedule")} <b>${(s.config.schedule_hours||[]).map(h=>h+":00").join(", ")
      || t("st_off")}</b></span>
     <span class="sep">·</span>
     <span>${t("st_disk")} <b>${d.free_gb ?? "?"} GB</b> ${t("st_of")} ${d.total_gb ?? "?"}</span>
     <span class="sep">·</span><span><b>${d.used_pct ?? "?"}%</b> ${t("st_used")}</span>
     ${s.quiet_now ? `<span class="sep">·</span><span class="chip warn">${t("st_quiet")}</span>` : ""}`;

  $("#warn").innerHTML = !s.space_ok ? `<div class="banner">${esc(s.space_warning)}</div>` : "";

  const qchips = r.queue.map(j => `<span class="chip">${esc(j.folder)} · ${esc(j.kind)}
      <button class="sm" data-act="unqueue" data-f="${esc(j.folder)}"
      style="padding:0 4px;border:0;background:none">✕</button></span>`).join("");
  $("#runbar").innerHTML = cur ? `<div class="runbar">
      <div class="runtop">
        <span class="chip run"><i class="pulse"></i>${
          esc(tkey(cur.stage, "stage_") || cur.kind)}</span>
        <b>${esc(cur.folder)}</b>
        ${cur.expected ? `<span class="mono" style="font-size:13px">${
          t("file_of", {a: cur.done || 0, b: cur.expected})}</span>` : ""}
        ${cur.percent ? `<span class="mono" style="font-size:13px">${cur.percent.toFixed(1)}%</span>` : ""}
        <span class="grow"></span>
        <button id="bPause">${t("b_pause")}</button>
        <button class="danger" id="bStop" title="${t("b_stop_title")}">${t("b_stop")}</button>
      </div>
      ${cur.item ? `<div class="runfile mono">${esc(cur.item)}</div>` : ""}
      <div class="prog"><i style="width:${cur.percent || 0}%"></i></div>
      ${r.queued ? `<div class="queue"><span>${t("q_next")}</span>${qchips}
        <button class="sm" id="bQClear">${t("q_clear")}</button></div>` : ""}
    </div>` : (r.queued ? `<div class="runbar"><div class="queue">
        <span>${t("q_inq")}</span>${qchips}
        <button class="sm" id="bQClear">${t("q_clear")}</button></div></div>` : "");

  $("#bSync").disabled = busy;
  $("#bIndex").disabled = busy;

  // Перерисовываем только при реальных изменениях: иначе каждые 2 секунды
  // сбрасывалась бы прокрутка и мерцал текст. Подпись компактная — по числам,
  // а не по всем спискам, чтобы не гонять сотни килобайт на каждом опросе.
  const sig = JSON.stringify([
    s.playlists.map(p => [p.folder, p.name, p.in_playlist, p.downloaded, p.pending,
                          p.rescued, p.lost, p.files_without_id, p.pending_gb,
                          p.queued, p.running, p.indexed_at,
                          p.last_run && p.last_run.finished]),
    openDet, Object.keys(orphCache).sort(), lang]);
  if (sig !== cardsSig) {
    cardsSig = sig;
    $("#cards").innerHTML = s.playlists.length ? s.playlists.map(row).join("")
      : `<div class="card empty">${t("no_playlists")}</div>`;
  }
  $("#folders").innerHTML = (s.known_folders||[]).map(f => `<option value="${esc(f)}">`).join("");

  const sel = $("#recFolder"), keep = sel.value;
  sel.innerHTML = s.playlists.map(p => `<option value="${esc(p.folder)}">${
    esc(t("rec_folder_opt", {name: p.name, n: p.files_without_id}))}</option>`).join("");
  if (keep) sel.value = keep;

  const c = s.config;
  if (document.activeElement !== $("#cHours")) $("#cHours").value = (c.schedule_hours||[]).join(",");
  if (document.activeElement !== $("#cQuiet")) $("#cQuiet").value = (c.quiet_hours||[]).join(",");
  if (document.activeElement !== $("#cFree")) $("#cFree").value = c.min_free_gb ?? 0;
  if (document.activeElement !== $("#cRate")) $("#cRate").value = c.limit_rate || "";
  if (document.activeElement !== $("#cFmt")) $("#cFmt").value = c.format || "";
  if (document.activeElement !== $("#cTpl")) $("#cTpl").value = c.output_template || "";
  $("#cThumb").checked = !!c.write_thumbnail;

  const k = s.cookies || {};
  $("#cookState").className = "chip " + (k.present ? "ok" : "");
  $("#cookState").textContent = k.present
    ? `${t("ck_count", {n:k.count})} · ${(k.domains||[]).slice(0,3).join(", ")} · ${dt(k.mtime)}`
    : t("ck_none");
  $("#kDel").disabled = !k.present;
}

async function loadLog() {
  try {
    const l = await api("/api/log?limit=250");
    $("#log").textContent = l.map(x =>
      `${x.ts.replace("T"," ").replace("+00:00","")} ${x.folder ? "["+x.folder+"] " : ""}${x.line}`
    ).join("\n") || t("log_empty");
  } catch(e) {}
}

/* =================== действия =================== */
document.addEventListener("click", async e => {
  const b = e.target.closest("button[data-act]");
  if (!b) return;
  const f = b.dataset.f, act = b.dataset.act;
  const p = (STATE?.playlists || []).find(x => x.folder === f);
  try {
    if (act === "del") {
      if (!confirm(t("c_del", {f}))) return;
      await api("/api/playlists/" + encodeURIComponent(f), {method:"DELETE"});
    } else if (act === "unqueue") {
      await api("/api/queue?folder=" + encodeURIComponent(f), {method:"DELETE"});
    } else if (act === "retry") {
      const r = await api("/api/retry/" + encodeURIComponent(f), {method:"POST"});
      alert(r.message + (r.count ? ` (${r.count})` : ""));
    } else if (act === "sync") {
      // Подтверждаем только дорогой запуск, чтобы не докучать на мелочи
      if (p && p.pending_gb != null && p.pending_gb >= 10 &&
          !confirm(t("c_sync", {n:p.pending, gb:p.pending_gb, free:STATE.disk.free_gb}))) return;
      const r = await api(`/api/run/sync?folder=${encodeURIComponent(f)}`, {method:"POST"});
      if (!r.ok) alert(r.message);
    } else {
      await api(`/api/run/${act}?folder=${encodeURIComponent(f)}`, {method:"POST"});
    }
    await refresh(); loadLog();
  } catch (err) { alert(err.message); }
});

// Раскрытие берём на себя: браузерное открывало бы несколько списков сразу,
// а перерисовка по опросу тут же их схлопывала.
document.addEventListener("click", async e => {
  const s = e.target.closest(".rdet summary");
  if (!s) return;
  e.preventDefault();
  const d = s.parentElement, key = d.dataset.det;
  openDet = (openDet === key) ? null : key;
  cardsSig = "";
  await refresh().catch(() => {});
  const folder = d.dataset.orph;
  if (folder && openDet === key && !orphCache[folder]) {
    try {
      orphCache[folder] = (await api("/api/orphans/" + encodeURIComponent(folder))).files;
      cardsSig = "";
      await refresh().catch(() => {});
    } catch (err) { /* останется «загружаю…», это не критично */ }
  }
});

document.addEventListener("click", async e => {
  const id = e.target.id;
  try {
    if (id === "bPause") { alert((await api("/api/control/pause", {method:"POST"})).message); }
    else if (id === "bStop") { alert((await api("/api/control/stop", {method:"POST"})).message); }
    else if (id === "bQClear") { await api("/api/queue", {method:"DELETE"}); }
    else return;
    refresh();
  } catch (err) { alert(err.message); }
});

$("#bSync").onclick = async () => {
  const tot = (STATE?.playlists || []).reduce((a, p) => a + (p.pending_gb || 0), 0);
  if (tot >= 10 && !confirm(t("c_sync_all", {gb: tot.toFixed(1), free: STATE.disk.free_gb}))) return;
  try { await api("/api/run/sync", {method:"POST"}); refresh(); loadLog(); }
  catch (err) { alert(err.message); }
};
$("#bIndex").onclick = async () => {
  try { await api("/api/run/index", {method:"POST"}); refresh(); loadLog(); }
  catch (err) { alert(err.message); }
};
$("#bLog").onclick = loadLog;
$("#bOut").onclick = async () => {
  if (!confirm(t("c_logout"))) return;
  await api("/api/auth/logout", {method:"POST"}); location.href = "/login";
};

$("#fAdd").onsubmit = async e => {
  e.preventDefault();
  try {
    const r = await api("/api/playlists", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({url:$("#aUrl").value, folder:$("#aFolder").value, name:$("#aName").value})});
    $("#aUrl").value = $("#aFolder").value = $("#aName").value = "";
    alert(r.archive_created ? t("a_add_new") : t("a_add_old", {n:r.archive_entries}));
    refresh(); loadLog();
  } catch (err) { alert(err.message); }
};

$("#fCfg").onsubmit = async e => {
  e.preventDefault();
  const hrs = s => s.split(",").map(x => x.trim()).filter(Boolean);
  try {
    await api("/api/config", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        schedule_hours: hrs($("#cHours").value), quiet_hours: hrs($("#cQuiet").value),
        min_free_gb: $("#cFree").value, limit_rate: $("#cRate").value,
        format: $("#cFmt").value, output_template: $("#cTpl").value,
        write_thumbnail: $("#cThumb").checked})});
    refresh();
  } catch (err) { alert(err.message); }
};

$("#fPw").onsubmit = async e => {
  e.preventDefault();
  try {
    await api("/api/auth/password", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({current:$("#pwOld").value, password:$("#pwNew").value})});
    $("#pwOld").value = $("#pwNew").value = "";
    alert(t("a_pw_ok"));
  } catch (err) { alert(err.message); }
};
$("#bRevoke").onclick = async () => {
  if (!confirm(t("c_revoke"))) return;
  await api("/api/auth/revoke", {method:"POST"});
  location.href = "/login";
};

async function sendCookies(body, isFile) {
  const opt = isFile ? {method:"POST", body}
    : {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({text:body})};
  const c = (await api("/api/cookies", opt)).cookies;
  alert(t("a_ck_ok", {n:c.count, d:(c.domains||[]).join(", ")})
        + (c.dropped ? t("a_ck_drop", {n:c.dropped}) : ""));
  refresh(); loadLog();
}
$("#fCook").onsubmit = async e => {
  e.preventDefault();
  const f = $("#kFile").files[0];
  if (!f) { alert(t("a_pick_file")); return; }
  const fd = new FormData(); fd.append("file", f);
  try { await sendCookies(fd, true); $("#kFile").value = ""; } catch (err) { alert(err.message); }
};
$("#kPaste").onclick = async () => {
  if (!$("#kText").value.trim()) { alert(t("a_empty")); return; }
  try { await sendCookies($("#kText").value, false); $("#kText").value = ""; }
  catch (err) { alert(err.message); }
};
$("#kDel").onclick = async () => {
  if (!confirm(t("c_ckdel"))) return;
  try { await api("/api/cookies", {method:"DELETE"}); refresh(); loadLog(); }
  catch (err) { alert(err.message); }
};

/* =================== сверка =================== */
$("#recLoad").onclick = async () => {
  const f = $("#recFolder").value;
  if (!f) return;
  $("#recBody").innerHTML = `<div class="empty">${t("rec_working")}</div>`;
  try {
    const d = await api("/api/reconcile/" + encodeURIComponent(f));
    if (!d.items.length) {
      $("#recBody").innerHTML = `<div class="empty">${t("rec_none")}</div>`;
      $("#recApply").disabled = true; return;
    }
    $("#recBody").innerHTML = d.items.map((it, i) => `<div class="rec-item">
      <div class="rec-file mono">${esc(it.file)}</div>
      ${it.suggestions.length ? it.suggestions.map(s => `<label class="rec-opt">
          <input type="radio" name="rec${i}" value="${esc(s.video_id)}">
          <span>${esc(s.title)}
            <span class="score">· ${Math.round(s.score*100)}% · ${esc(s.video_id)}${
              s.in_playlist ? "" : " · " + t("rec_notin")}</span></span></label>`).join("")
        : `<div class="hint">${t("rec_nomatch")}</div>`}
      <label class="rec-opt"><input type="radio" name="rec${i}" value="" checked>
        <span class="score">${t("rec_skip")}</span></label></div>`).join("");
    $("#recApply").disabled = false;
  } catch (err) { $("#recBody").innerHTML = `<div class="empty">${esc(err.message)}</div>`; }
};
$("#recApply").onclick = async () => {
  const pairs = [...document.querySelectorAll("#recBody input[type=radio]:checked")]
    .filter(r => r.value).map(r => ({video_id: r.value}));
  if (!pairs.length) { alert(t("rec_nothing")); return; }
  if (!confirm(t("rec_confirm", {n:pairs.length}))) return;
  try {
    const r = await api("/api/reconcile/" + encodeURIComponent($("#recFolder").value),
      {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({pairs})});
    alert(t("rec_added", {n:r.added}));
    $("#recLoad").click(); refresh();
  } catch (err) { alert(err.message); }
};

refresh().catch(() => {});
loadLog();
setInterval(() => refresh().catch(() => {}), 2000);
setInterval(() => { if (busy && $("#lAuto").checked) loadLog(); }, 3000);
</script>
</body>
</html>
